<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#aee0ee}
#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#css2d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.panel{background:rgba(255,248,244,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;box-shadow:var(--sh);border:1px solid #ffffff99}

.btn:hover{background:var(--yellow)}

.btn:focus-visible{outline:3px solid var(--coral);outline-offset:1px}
.btn.on{background:var(--ink);color:var(--cream)}

.bignum{font-family:Georgia,serif;font-style:italic;font-size:34px;font-weight:700;color:var(--coral);line-height:1}

<script type="module">
/* ============ 00 · Three.js loader (CDN primary + fallback) ============
   規格要求：Three.js 改用 jsdelivr，若用戶網絡擋晒 → 自動切 unpkg。
   做法：先 HEAD 探測 primary，失敗就注入指向 fallback 嘅 importmap，
   再用動態 import 載入 core + 4 個 addon（top-level await）。
   ?cdn=fallback 強制走 fallback（測試用）。
   ==================================================================== */
const CDN_BASES = {
  primary: 'https://cdn.jsdelivr.net/npm/three@0.160.0/',
  fallback: 'https://unpkg.com/three@0.160.0/'
};
async function loadThree() {
  const forced = new URLSearchParams(location.search).get('cdn');
  let base = CDN_BASES.primary;
  let viaFallback = false;
  if (forced === 'fallback') {
    base = CDN_BASES.fallback; viaFallback = true;
  } else {
    try {
      const r = await fetch(base + 'build/three.module.js', { method: 'HEAD' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
    } catch (e) {
      base = CDN_BASES.fallback; viaFallback = true;
    }
  }
  // 注入 importmap（head.html 嘅靜態 importmap 已移除，避免兩份 map 優先次序問題）
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({
    imports: {
      'three': base + 'build/three.module.js',
      'three/addons/': base + 'examples/jsm/'
    }
  });
  document.head.appendChild(im);

  const [core, controls, css2d, rbox, buf] = await Promise.all([
    import('three'),
    import('three/addons/controls/OrbitControls.js'),
    import('three/addons/renderers/CSS2DRenderer.js'),
    import('three/addons/geometries/RoundedBoxGeometry.js'),
    import('three/addons/utils/BufferGeometryUtils.js')
  ]);
  return {
    THREE: core,
    OrbitControls: controls.OrbitControls,
    CSS2DRenderer: css2d.CSS2DRenderer,
    CSS2DObject: css2d.CSS2DObject,
    RoundedBoxGeometry: rbox.RoundedBoxGeometry,
    mergeGeometries: buf.mergeGeometries,
    CDN: base, viaFallback
  };
}
const { THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoundedBoxGeometry, mergeGeometries, CDN, viaFallback } = await loadThree();

/* ============ 01 · DATA + helpers ============ */
const LANG = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'zh';
const tr = (o) => (typeof o === 'string') ? o : (LANG === 'en' ? (o.en || o.zh) : o.zh);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RNG = mulberry(20261023);
const rnd = (a = 0, b = 1) => a + RNG() * (b - a);
// value noise + fbm
const PERM = new Uint8Array(512);
(function () { const p = new Uint8Array(256); for (let i = 0; i < 256; i++) p[i] = i; for (let i = 255; i > 0; i--) { const j = (RNG() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; })();
function vnoise(x, y) {
  const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255, xf = x - Math.floor(x), yf = y - Math.floor(y);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const aa = PERM[PERM[xi] + yi] / 255, ba = PERM[PERM[xi + 1] + yi] / 255;
  const ab = PERM[PERM[xi] + yi + 1] / 255, bb = PERM[PERM[xi + 1] + yi + 1] / 255;
  return lerp(lerp(aa, ba, u), lerp(ab, bb, u), v);
}
function fbm(x, y) { let a = 0, amp = .5, f = 1; for (let i = 0; i < 4; i++) { a += amp * vnoise(x * f, y * f); f *= 2; amp *= .5; } return a; }

/* ---------- palette ---------- */
const PAL = {
  coral: 0xdb6a41, ink: 0x211d1d, cream: 0xfff8f4, yellow: 0xfcea8b, stone: 0xc5b5a7, green: 0x71806a,
  glass: 0x86a8a6, wood: 0xb48560, teal: 0x3e7c8c,
  plant: [0x9cc27a, 0x8db86f, 0x728f5f], pastel: [0xf2b5c6, 0x58a6a6, 0x6f7fb5],
  wall: 0xf4ebdd, eave: 0xa34e34, win: 0xa8c4c2, night: 0xffc777,
  metal: 0xc9c2b6
};

/* ---------- islands ---------- */
const ISLANDS = [
  { id: 'hub', no: '00', icon: '🏛️', name: { zh: '市政', en: 'Civic' }, color: 0xc5b5a7, ang: null,
    summary: { zh: '中央市政廳把六座政策島接在一起：所有跨部門文件、撥款同覆核都在這裡出發。', en: 'The central city hall links all six policy islands: cross-department paperwork, funding and sign-off all start here.' } },

function updateDayCycle(dt) {
  if (!Clock.paused && !STATE.reduced) {
    Clock.minutes = (Clock.minutes + dt * Clock.speed) % 1440;
  }
  const min = Math.round(Clock.minutes / 10) * 10;   // 量化到 10 分鐘
  const t = clamp((min - 360) / 720, 0, 1);
  const az = Math.PI * (0.15 + 0.7 * t);
  const el = 0.35 + Math.sin(t * Math.PI) * 0.75;
  const dir = new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), 0.55 * Math.cos(el) + 0.35).normalize();
  sun.position.copy(dir).multiplyScalar(40);
  sun.target.position.set(0, 0, 0);
  skyUniforms.sunDir.value.copy(dir);

  // night factor 0..1 —— 由時鐘決定（太陽方位公式在 18:00 後 t 被 clamp，
  // 只用 el 會令 21:00 變成黃昏，所以夜間光照用鐘點推算）
  const dayWin = smoothstep(300, 420, min) * (1 - smoothstep(1020, 1170, min));
  const night = 1 - dayWin;
  STATE.night = night;
  STATE.day = 1 - night;
  skyUniforms.night.value = night;
  seaUniforms.uNight.value = night;

  // sky colours
  const top = new THREE.Color(), mid = new THREE.Color(), bot = new THREE.Color();
  if (el < 0.42) { // dawn / dusk
    const k = smoothstep(0.12, 0.42, el);
    top.setHex(DAY_COLS.duskTop).lerp(cA.setHex(DAY_COLS.dayTop), k);
    mid.setHex(DAY_COLS.duskMid).lerp(cA.setHex(DAY_COLS.dayMid), k);
    bot.setHex(DAY_COLS.duskBot).lerp(cA.setHex(DAY_COLS.dayBot), k);
  } else {
    top.setHex(DAY_COLS.dayTop); mid.setHex(DAY_COLS.dayMid); bot.setHex(DAY_COLS.dayBot);
  }
  // night blend
  top.lerp(cA.setHex(DAY_COLS.nightTop), night * 0.85);
  mid.lerp(cA.setHex(DAY_COLS.nightMid), night * 0.85);
  bot.lerp(cA.setHex(DAY_COLS.nightBot), night);
  skyUniforms.topColor.value.copy(top);
  skyUniforms.midColor.value.copy(mid);
  skyUniforms.botColor.value.copy(bot);
  scene.fog.color.copy(mid).lerp(cA.setHex(0x1b2748), night * 0.75);
  renderer.setClearColor(scene.fog.color);

  // lights: 夜晚 hemi 反而較強（冷藍但看得清楚）
  // 夜晚：hemi 反而較強（冷藍但看得清楚）—— 規格明確要求
  hemi.color.setHex(0xbfe4f2).lerp(cA.setHex(0x8fa6e8), night);
  hemi.groundColor.setHex(0x6b6154).lerp(cA.setHex(0x3a4468), night);
  hemi.intensity = lerp(0.75, 1.55, night);
  sun.intensity = lerp(1.55, 0.22, night);
  sun.color.setHex(0xfff0d8).lerp(cA.setHex(0xffb27a), night * 0.7);
  moon.intensity = night * 0.85;
  renderer.toneMappingExposure = lerp(1.05, 1.28, night);
  moon.position.set(-dir.x * 40, 40, -dir.z * 40);
  seaUniforms.uShallow.value.setHex(0x7fd3d8).lerp(cA.setHex(0x2c4a6e), night);
  seaUniforms.uDeep.value.setHex(0x2a6b8f).lerp(cA.setHex(0x0c1c38), night);

  // emissive night glow
  const gi = 0.05 + night * 3.2;
  if (typeof window.__setGlow === 'function') window.__setGlow(gi);
  if (typeof window.__setLampPool === 'function') window.__setLampPool(night);
  if (typeof window.__setIslandLights === 'function') window.__setIslandLights(night);

  const ce = document.getElementById('clockTxt');
  if (ce) ce.textContent = Clock.label;
  STATE.dirty = true;
}

/* ---------- 盆地地形 ---------- */
const TERRAIN_SIZE = 200, TERRAIN_SEG = 176;

/* 城市盆地（r<32）保持沉入潟湖；環狀山由 r=40 才開始，避免侵入城市。
   所有 fbm 噪聲都乘上 ≥32 先起動嘅窗，確保 r<32 冇山。 */
function terrainHeight(x, z) {
  const r = Math.hypot(x, z);
  let h = smoothstep(40, 55, r) * (1 - smoothstep(72, 94, r)) * 13.0;
  h += (fbm(x * 0.035 + 11, z * 0.035 + 7) - 0.5) * 7.0 * smoothstep(40, 56, r);
  h += (fbm(x * 0.11 + 3, z * 0.11 + 19) - 0.5) * 2.0 * smoothstep(32, 46, r);
  // 梯田量化
  if (h > 0.6) h = Math.round(h / 1.15) * 1.15 + (fbm(x * 0.5, z * 0.5) - 0.5) * 0.34;
  // 城市盆地：r<32 壓到海平面下（島嶼浮在潟湖上）
  h -= (1 - smoothstep(28, 38, r)) * 5.0;
  // 鏡頭那一側（+z）壓低並沉入潟湖之下，避免前景綠色台地擋住城市
  const camSide = clamp((z + 12) / 46, 0, 1);
  h *= lerp(1, 0.10, camSide * smoothstep(16, 36, r));
  h -= camSide * smoothstep(20, 46, r) * 5.0;
  // 外圈沉入海面（否則地形平面邊緣會變成一大片綠色台地）
  h -= smoothstep(88, 104, r) * 10.0;
  return h;
}

const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);

{
  const pos = terrainGeo.attributes.position;

  const cRiver = new THREE.Color(0x8fb3ad), cSand = new THREE.Color(0xd9c9a3),

    cForest = new THREE.Color(0x6f8a62), cRock = new THREE.Color(0xb2a38d);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = terrainHeight(x, z);
    pos.setY(i, h);
    // 依高度上頂點色
    const hy = h;
    if (hy < -1.0) tmp.copy(cRiver);
    else if (hy < 0.7) tmp.copy(cRiver).lerp(cSand, smoothstep(-1.0, 0.7, hy));
    else if (hy < 2.6) tmp.copy(cSand).lerp(cField, smoothstep(0.7, 2.6, hy));
    else if (hy < 5.2) tmp.copy(cField).lerp(cGrass, smoothstep(2.6, 5.2, hy));
    else if (hy < 9.0) tmp.copy(cGrass).lerp(cForest, smoothstep(5.2, 9.0, hy));
    else tmp.copy(cForest).lerp(cRock, smoothstep(9.0, 13.0, hy));
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();

function coniferGeo() {
  const parts = [];
  for (let i = 0; i < 3; i++) {
    const g = new THREE.ConeGeometry(0.62 - i * 0.14, 1.05 - i * 0.16, 7);
    g.translate(0, 0.52 + i * 0.48, 0);
    parts.push(g);
  }
  const trunk = new THREE.CylinderGeometry(0.1, 0.13, 0.55, 6);
  trunk.translate(0, 0.26, 0);
  parts.push(trunk);
  return mergeGeometries(parts.map(ni), false);
}
function broadleafGeo() {
  const parts = [];
  const trunk = new THREE.CylinderGeometry(0.1, 0.14, 0.7, 6);
  trunk.translate(0, 0.35, 0);
  parts.push(trunk);
  const blobs = [[0, 1.05, 0, 0.60], [0.34, 0.86, 0.18, 0.44], [-0.30, 0.92, -0.14, 0.40], [0.06, 1.32, -0.22, 0.38]];
  for (const [x, y, z, s] of blobs) {
    const g = new THREE.IcosahedronGeometry(s, 0);
    g.translate(x, y, z);
    parts.push(g);
  }
  return mergeGeometries(parts.map(ni), false);
}
/* mergeGeometries 需要一致的 index/attribute：IcosahedronGeometry 無 index，
   其餘都有 → 全部轉成 non-indexed 再合併，否則 merge 回傳 null */
function ni(g) { return g.index ? g.toNonIndexed() : g; }

const treeBroad = new THREE.InstancedMesh(broadleafGeo(), treeMat, TREE_N - Math.floor(TREE_N * 0.55));
treeConifer.castShadow = false; treeConifer.receiveShadow = false;
treeBroad.castShadow = false; treeBroad.receiveShadow = false;
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  let ci = 0, bi = 0, maxC = treeConifer.count, maxB = treeBroad.count;
  let guard = 0;
  while ((ci < maxC || bi < maxB) && guard < TREE_N * 12) {
    guard++;
    const a = RNG() * TAU, rr = 38 + RNG() * 42;
    const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
    const h = terrainHeight(x, z);
    if (h < 0.25) continue;                      // 水下不種樹
    const camSide = clamp((z + 12) / 46, 0, 1);
    if (RNG() < camSide * 0.55) continue;         // 鏡頭側稀疏
    const sc = 0.75 + RNG() * 0.85;
    p.set(x, h - 0.1, z);
    q.setFromEuler(new THREE.Euler(0, RNG() * TAU, 0));
    s.set(sc * (0.85 + RNG() * 0.3), sc, sc * (0.85 + RNG() * 0.3));
    m.compose(p, q, s);
    const green = new THREE.Color().setHSL(0.24 + RNG() * 0.07, 0.30 + RNG() * 0.16, 0.24 + RNG() * 0.16);
    if (ci < maxC) { treeConifer.setMatrixAt(ci, m); treeConifer.setColorAt(ci, green); ci++; }
    else if (bi < maxB) { treeBroad.setMatrixAt(bi, m); treeBroad.setColorAt(bi, green); bi++; }
  }
  for (let i = ci; i < maxC; i++) { m.makeScale(0, 0, 0); treeConifer.setMatrixAt(i, m); }
  for (let i = bi; i < maxB; i++) { m.makeScale(0, 0, 0); treeBroad.setMatrixAt(i, m); }
  treeConifer.instanceMatrix.needsUpdate = true; treeBroad.instanceMatrix.needsUpdate = true;

/* push a part in unit space; builder applies model→world transform */
function makeBuilder(origin, scale, rotY) {
  const base = new THREE.Matrix4().compose(
    origin,
    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rotY, 0)),
    new THREE.Vector3(scale, scale, scale));
  return {
    push(kind, x, y, z, sx, sy, sz, color, rx = 0, ry = 0, rz = 0, item = null, island = null, small = false) {
      const j = 1 + (Math.random() * 2 - 1) * 0.0072;   // 防 z-fighting 抖動
      const local = new THREE.Matrix4().compose(
        new THREE.Vector3(x, y, z),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
        new THREE.Vector3(sx * j, sy * j, sz * j));
      const world = base.clone().multiply(local);
      kitList[kind].push({ m: world, color: new THREE.Color(color), item, island, small, base: new THREE.Color(color) });
    }
  };
}

/* ---------- islands ---------- */
const ISL_MESH = {};        // id -> {group, labelObj, nodes}
const GRAPH = { nodes: [], edges: [] };
const ISL_NODES = {};       // id -> {center: nodeIdx, ring: [6 nodeIdx]}

function addNode(x, y, z) { GRAPH.nodes.push(new THREE.Vector3(x, y, z)); return GRAPH.nodes.length - 1; }
function addEdge(a, b) {
  const d = GRAPH.nodes[a].distanceTo(GRAPH.nodes[b]);
  GRAPH.edges.push([a, b, d]);
}

const ISL_ORDER = ['transport', 'education', 'health', 'housing', 'environment', 'economy'];
const ISL_SPECIES = {
  hub: 'cherry', transport: 'willow', education: 'fruit', health: 'pine',
  housing: 'palm', environment: 'cherry', economy: 'fruit'
};

/* island platform + road ring */
function buildIsland(I) {
  const g = new THREE.Group();
  const pos = ISL_POS[I.id];
  const x = pos.x, z = pos.y;
  const isHub = I.id === 'hub';
  const rad = isHub ? ISL_RAD + 0.5 : ISL_RAD;
  // 崖體
  const cliff = new THREE.Mesh(
    new THREE.CylinderGeometry(rad, rad * 0.88, 3.2, 6),
    new THREE.MeshStandardMaterial({ color: isHub ? 0x9c8b7a : 0x8f8271, flatShading: true, roughness: 0.95 }));
  cliff.position.set(x, ISL_TOP - 1.6, z);
  cliff.rotation.y = Math.PI / 6;
  cliff.castShadow = true; cliff.receiveShadow = true;
  cliff.userData = { pick: 'island', id: I.id };
  g.add(cliff);
  // 島面
  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(rad * 0.99, rad * 0.99, 0.34, 6),
    new THREE.MeshStandardMaterial({ color: I.color, flatShading: true, roughness: 0.9 }));
  top.position.set(x, ISL_TOP - 0.17, z);
  top.rotation.y = Math.PI / 6;
  top.receiveShadow = true;
  top.userData = { pick: 'island', id: I.id };
  g.add(top);
  // 路環
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(RING_R - 0.42, RING_R + 0.42, 6, 1),
    new THREE.MeshStandardMaterial({ color: 0xd8c9b6, roughness: 0.95 }));
  ring.rotation.x = -Math.PI / 2;
  ring.rotation.z = Math.PI / 6;
  ring.position.set(x, ISL_TOP + 0.012, z);
  ring.receiveShadow = true;
  g.add(ring);
  // 中心廣場
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(1.5, 24), new THREE.MeshStandardMaterial({ color: 0xe6dac9, roughness: 0.95 }));
  plaza.rotation.x = -Math.PI / 2; plaza.position.set(x, ISL_TOP + 0.014, z); plaza.receiveShadow = true;
  g.add(plaza);

  // 節點：中心 + 6 環節點
  const base = isHub ? 0 : (I.ang * Math.PI / 180);
  const center = addNode(x, ISL_TOP, z);
  const ringNodes = [];
  for (let i = 0; i < 6; i++) {
    const a = base + i / 6 * TAU;
    ringNodes.push(addNode(x + Math.sin(a) * RING_R, ISL_TOP, z + Math.cos(a) * RING_R));
  }
  for (let i = 0; i < 6; i++) {
    addEdge(center, ringNodes[i]);
    addEdge(ringNodes[i], ringNodes[(i + 1) % 6]);
  }
  ISL_NODES[I.id] = { center, ring: ringNodes, x, z, base };

  // 外圈路燈 + 串燈 + 盆栽 + 灌木 + 花
  const b = makeBuilder(new THREE.Vector3(x, ISL_TOP, z), 1, 0);
  for (let i = 0; i < 6; i++) {
    const a = base + i / 6 * TAU;
    const lx = Math.sin(a) * (rad - 0.75), lz = Math.cos(a) * (rad - 0.75);
    b.push('cylinder', lx, 0.42, lz, 0.09, 0.84, 0.09, PAL.ink, 0, 0, 0, null, I.id, false);
    b.push('glowsphere', lx, 0.88, lz, 0.20, 0.20, 0.20, PAL.night, 0, 0, 0, null, I.id, false);
    // 盆栽 + 灌木 + 花
    const pa = a + 0.42;
    const px = Math.sin(pa) * (rad - 0.55), pz = Math.cos(pa) * (rad - 0.55);
    b.push('cylinder', px, 0.11, pz, 0.20, 0.22, 0.20, PAL.coral, 0, 0, 0, null, I.id, true);
    b.push('sphere', px, 0.30, pz, 0.30, 0.30, 0.30, PAL.plant[1], 0, 0, 0, null, I.id, true);
    const fa = a - 0.42;

function standaloneBuilder(origin, scale, rotY) {
  const group = new THREE.Group();

    origin,

        new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
        new THREE.Vector3(sx * j, sy * j, sz * j));
      const world = base.clone().multiply(local);

        ? new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0, emissive: new THREE.Color(color), emissiveIntensity: 0.9 })
        : new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.78, metalness: 0 });
      const mesh = new THREE.Mesh(KITS[kind].geo, mat);

      if (item) mesh.userData = { pick: 'item', id: item };

  };

/* ---------- Dijkstra over road graph ---------- */
function shortestPath(a, b) {
  const N = GRAPH.nodes.length;
  const dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), done = new Array(N).fill(false);
  dist[a] = 0;
  for (let it = 0; it < N; it++) {
    let u = -1;
    for (let i = 0; i < N; i++) if (!done[i] && (u < 0 || dist[i] < dist[u])) u = i;
    if (u < 0 || dist[u] === Infinity) break;
    if (u === b) break;
    done[u] = true;
    for (const [x, y, w] of GRAPH.edges) {
      let v = -1;
      if (x === u) v = y; else if (y === u) v = x;
      if (v < 0) continue;
      if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
    }
  }
  const path = [];
  let cur = b;
  while (cur >= 0) { path.unshift(cur); if (cur === a) break; cur = prev[cur]; }
  return path[0] === a ? path : [a, b];
}

/* ---------- walker update ---------- */
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(1, 1, 1), _e = new THREE.Euler();
function place(mesh, idx, x, y, z, yaw, rx, ry, rz, sx, sy, sz) {

  _q.setFromEuler(_e);

}
function samplePath(o, t) {
  const d = clamp(t, 0, 1) * o.total;
  let i = 1;
  while (i < o.cum.length - 1 && o.cum[i] < d) i++;
  const a = o.pts[i - 1], b = o.pts[i];
  const seg = o.cum[i] - o.cum[i - 1] || 1;
  const k = clamp((d - o.cum[i - 1]) / seg, 0, 1);
  const x = lerp(a.x, b.x, k), z = lerp(a.z, b.z, k);
  const yaw = Math.atan2(b.x - a.x, b.z - a.z);

}
const LOG_EVENTS = [];
function logEvent(type, flowId, w) {

  if (LOG_EVENTS.length > 60) LOG_EVENTS.pop();

}
function updateWalkers(dt, time) {
  const camPos = camera.position;
  for (let i = 0; i < WALKERS.length; i++) {
    const w = WALKERS[i];
    const o = FLOW_OBJ[w.flow];
    if (w.pause > 0) {
      w.pause -= dt;
      if (w.pause <= 0) { w.dir *= -1; logEvent('depart', w.flow, w); }
    } else {
      const prev = w.t;
      w.t += (w.dir * w.speed * dt) / o.total;
      if (w.t > 1) { w.t = 1; w.pause = 1.4; logEvent('arrive', w.flow, w); logEvent('handoff', w.flow, w); }
      else if (w.t < 0) { w.t = 0; w.pause = 1.4; logEvent('arrive', w.flow, w); logEvent('handoff', w.flow, w); }
    }
    const sp = samplePath(o, w.t);
    w.x = sp.x; w.z = sp.z; w.yaw = sp.yaw;
    const ph = time * 9 + w.phase * 20;
    const moving = w.pause <= 0;
    const swing = moving ? Math.sin(ph) : 0;
    const bob = moving ? Math.abs(Math.sin(ph)) * 0.012 : 0;
    const S = WALK_SCALE;
    const dcam = Math.hypot(camPos.x - sp.x, camPos.z - sp.z);
    const ds = clamp(dcam / 20, 1, 1.45);
    const s = S * ds;
    const base = ISL_TOP + 0.02;

    place(WM.legL, i, sp.x + Math.cos(sp.yaw) * 0.022 * s, base + (0.075 + bob) * s, sp.z - Math.sin(sp.yaw) * 0.022 * s, sp.yaw, swing * 0.55 * s, 0, 0, s, s, s);
    place(WM.legR, i, sp.x - Math.cos(sp.yaw) * 0.022 * s, base + (0.075 + bob) * s, sp.z + Math.sin(sp.yaw) * 0.022 * s, sp.yaw, -swing * 0.55 * s, 0, 0, s, s, s);
    place(WM.armL, i, sp.x + Math.cos(sp.yaw) * 0.062 * s, base + (0.225 + bob) * s, sp.z - Math.sin(sp.yaw) * 0.062 * s, sp.yaw, -swing * 0.45 * s, 0, 0, s, s, s);
    place(WM.armR, i, sp.x - Math.cos(sp.yaw) * 0.062 * s, base + (0.225 + bob) * s, sp.z + Math.sin(sp.yaw) * 0.062 * s, sp.yaw, swing * 0.45 * s, 0, 0, s, s, s);
    place(WM.body, i, sp.x, base + (0.205 + bob) * s, sp.z, sp.yaw, 0, 0, 0, s, s, s);
    place(WM.head, i, sp.x, base + (0.288 + bob) * s, sp.z, sp.yaw, 0, 0, 0, s, s, s);
    place(WM.hair, i, sp.x, base + (0.292 + bob) * s, sp.z, sp.yaw, 0, 0, 0, s, s, s);
    const fx = Math.sin(sp.yaw) * 0.058 * s, fz = Math.cos(sp.yaw) * 0.058 * s;
    const rx = Math.cos(sp.yaw) * 0.026 * s, rz = -Math.sin(sp.yaw) * 0.026 * s;
    place(WM.eye, i * 2, sp.x + rx + fx, base + (0.292 + bob) * s, sp.z + rz + fz, sp.yaw, 0, 0, 0, s, s, s);
    place(WM.eye, i * 2 + 1, sp.x - rx + fx, base + (0.292 + bob) * s, sp.z - rz + fz, sp.yaw, 0, 0, 0, s, s, s);
    place(WM.shadow, i, sp.x, base + 0.005, sp.z, 0, -Math.PI / 2, 0, 0, s * (1 - bob * 2), s * (1 - bob * 2), s * (1 - bob * 2));

    // accessories
    const R = ROLES[w.role];
    for (const k of ACC_ORDER) {
      const on = R.acc.includes(k);
      if (!on) { place(WM['acc_' + k], i, 0, -999, 0, 0, 0, 0, 0, 0.0001, 0.0001, 0.0001); continue; }
      let ax = 0, ay = 0, az = 0, ax2 = 0, ay2 = 0, az2 = 0, arx = 0, arz = 0;
      if (k === 'vest' || k === 'coat') { ay = 0.215; az = 0; }
      else if (k === 'badge') { ay = 0.225; az = 0.056; }
      else if (k === 'cane') { ax = 0.085; ay = 0.12; az = 0.01; arz = 0.12; }
      else if (k === 'hat') { ay = 0.335; }
      else if (k === 'helmet') { ay = 0.292; }
      else if (k === 'straw') { ay = 0.34; }
      else if (k === 'stroller') { ax = 0.14; ay = 0.10; }
      else if (k === 'bike') { ax = 0.0; ay = 0.075; }
      else if (k === 'case') { ax = -0.10; ay = 0.075; }
      const wx = sp.x + (Math.cos(sp.yaw) * ax + Math.sin(sp.yaw) * az) * s;
      const wz = sp.z + (-Math.sin(sp.yaw) * ax + Math.cos(sp.yaw) * az) * s;
      place(WM['acc_' + k], i, wx, base + ay * s, wz, sp.yaw, arx, 0, arz, s, s, s);
    }
    // badge + name
    const showBadge = (typeof TOGGLES !== 'undefined' && TOGGLES.carry) && dcam < 16;
    w.badge.visible = showBadge;
    if (showBadge) {
      w.badge.position.set(sp.x, base + (0.42 + bob) * s, sp.z);
      w.badge.scale.set(0.42 * ds, 0.42 * ds, 1);
    }
    const showName = (typeof TOGGLES !== 'undefined' && TOGGLES.names) && dcam < 14;
    w.nameObj.visible = showName;
    if (showName) w.nameObj.position.set(sp.x, base + (0.46 + bob) * s, sp.z);
  }
  for (const k in WM) WM[k].instanceMatrix.needsUpdate = true;
}

/* ---------- highlight (tint via setColorAt) ---------- */
const TINT_CORAL = new THREE.Color(PAL.coral), TINT_YELLOW = new THREE.Color(PAL.yellow);

/* ---------- flow visibility ---------- */
function relatedFlows() {

/* ---------- camera flight ---------- */
const flight = { active: false, t: 0, dur: 0.9, fromP: new THREE.Vector3(), toP: new THREE.Vector3(), fromT: new THREE.Vector3(), toT: new THREE.Vector3() };
function flyTo(target, dist, height) {
  const dir = new THREE.Vector3().subVectors(camera.position, controls.target);
  dir.y = 0;
  if (dir.lengthSq() < 0.001) dir.set(0.4, 0, 1);
  dir.normalize();
  flight.fromP.copy(camera.position);
  flight.fromT.copy(controls.target);
  flight.toT.copy(target);
  flight.toP.copy(target).addScaledVector(dir, dist);
  flight.toP.y = target.y + height;
  flight.t = 0;
  flight.active = true;
  if (STATE.reduced) {
    camera.position.copy(flight.toP);
    controls.target.copy(flight.toT);
    flight.active = false;
    STATE.dirty = true;
  }
}
function updateFlight(dt) {
  if (!flight.active) return;
  flight.t = Math.min(1, flight.t + dt / flight.dur);
  const k = flight.t < 0.5 ? 2 * flight.t * flight.t : 1 - Math.pow(-2 * flight.t + 2, 2) / 2;
  camera.position.lerpVectors(flight.fromP, flight.toP, k);
  controls.target.lerpVectors(flight.fromT, flight.toT, k);
  STATE.dirty = true;
  if (flight.t >= 1) flight.active = false;
}

/* ---------- raycast selection ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downXY = null, downT = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { downXY = [e.clientX, e.clientY]; downT = performance.now(); });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downXY) return;
  const dx = e.clientX - downXY[0], dy = e.clientY - downXY[1];
  const moved = Math.hypot(dx, dy);
  downXY = null;
  if (moved > 6 || performance.now() - downT > 700) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const targets = [];
  for (const kind in kitMeshes) targets.push(kitMeshes[kind]);
  for (const k in WM) targets.push(WM[k]);
  for (const f of FLOWS) { const o = FLOW_OBJ[f.id]; if (o.tube.visible) targets.push(o.tube); }
  scene.traverse(o => { if (o.isMesh && o.userData && o.userData.pick === 'island') targets.push(o); });
  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) { select(null, null); return; }
  const hit = hits[0];
  const obj = hit.object;
  if (obj.userData.pick === 'island') { select('island', obj.userData.id); return; }
  if (obj.userData.pick === 'flow') { select('flow', obj.userData.id); return; }
  if (obj.userData.kind) {
    // 建物 instance → item
    const rec = kitList[obj.userData.kind][hit.instanceId];
    if (rec && rec.item) { select('item', rec.item); return; }
    select(null, null);
    return;
  }
  if (obj.userData.pick === 'walker') {
    // 找 walker index
    const idx = hit.instanceId;
    select('walker', WALKERS[idx] ? WALKERS[idx].id : null);
    return;
  }
  select(null, null);
});

/* ---------- select ---------- */
function select(kind, id) {
  SEL.kind = kind; SEL.id = id;
  if (!kind) {
    clearPins();
    refreshHighlight();
    refreshFlowVisibility();
    document.getElementById('card').hidden = true;
    updateLabels();
    STATE.dirty = true;
    return;
  }
  if (kind === 'island') {
    buildPins(id);
    const isl = ISL_NODES[id];
    flyTo(new THREE.Vector3(isl.x, ISL_TOP + 1.2, isl.z), 22, 15);
  } else if (kind === 'item') {
    const w = ITEM_WORLD[id];
    flyTo(new THREE.Vector3(w.pos.x, ISL_TOP + 1.0, w.pos.z), 9, 7);
  } else if (kind === 'walker') {
    const w = WALKERS.find(x => x.id === id);
    if (w) flyTo(new THREE.Vector3(w.x, ISL_TOP + 0.6, w.z), 5.5, 3.4);
  } else if (kind === 'flow') {
    const o = FLOW_OBJ[id];
    const mid = o.pts[Math.floor(o.pts.length / 2)];
    flyTo(new THREE.Vector3(mid.x, ISL_TOP + 1.4, mid.z), 20, 15);
  }
  refreshHighlight();
  refreshFlowVisibility();
  openCard(kind, id);
  updateLabels();
  STATE.dirty = true;
}

/* ---------- label dim / collision avoidance ---------- */
const labelBoxes = [];
function updateLabels() {
  for (const I of ISLANDS) {
    const L = ISL_MESH[I.id] && ISL_MESH[I.id].label;
    if (!L || !L.el) continue;   // 新聞島 label 未建好都唔可以 crash
    const sel = SEL.kind === 'island' && SEL.id === I.id;
    L.el.classList.toggle('sel', sel);
    L.el.classList.toggle('dim', !!SEL.kind && !sel);
  }
  // 碰撞避讓
  const panels = ['brand', 'side', 'card', 'hud', 'logPanel'].map(id => document.getElementById(id)).filter(e => e && !e.hidden && e.offsetParent !== null);
  const panelRects = panels.map(p => p.getBoundingClientRect());
  labelBoxes.length = 0;
  const list = ISLANDS.map(I => (ISL_MESH[I.id] && ISL_MESH[I.id].label) || null).filter(Boolean);
  for (const L of list) {
    const r = L.el.getBoundingClientRect();
    if (!r.width) continue;
    let collide = false;
    for (const p of panelRects) if (r.left < p.right && r.right > p.left && r.top < p.bottom && r.bottom > p.top) { collide = true; break; }
    if (!collide) for (const b of labelBoxes) if (r.left < b.right + 8 && r.right > b.left - 8 && r.top < b.bottom + 8 && r.bottom > b.top - 8) { collide = true; break; }
    if (collide) {
      if (!L.el.classList.contains('mini')) { L.el.classList.add('mini'); STATE.dirty = true; }
    } else if (L.el.classList.contains('mini')) { L.el.classList.remove('mini'); STATE.dirty = true; }
    L.el.style.visibility = L.el.classList.contains('mini') ? 'visible' : 'visible';
    labelBoxes.push(r);
  }
}

/* ---------- thumbnail offscreen render (160²) ---------- */
const thumbRT = new THREE.WebGLRenderTarget(160, 160, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const thumbCam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const thumbCanvas = document.createElement('canvas');
thumbCanvas.width = 160; thumbCanvas.height = 160;
const thumbCtx = thumbCanvas.getContext('2d');
const thumbBuf = new Uint8Array(160 * 160 * 4);
function renderThumb(itemId) {
  const w = ITEM_WORLD[itemId];
  if (!w) return '';
  const it = ITEMS[itemId];
  const big = ['book', 'coin', 'clock', 'globe'].includes(it.model);
  const dist = big ? 6.2 : 4.6;
  thumbCam.position.set(w.pos.x + dist * 0.85, w.pos.y + dist * 0.62, w.pos.z + dist * 0.85);
  thumbCam.lookAt(w.pos.x, w.pos.y + 0.75, w.pos.z);
  const prevTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(thumbRT);
  renderer.clear();
  renderer.render(scene, thumbCam);
  renderer.readRenderTargetPixels(thumbRT, 0, 0, 160, 160, thumbBuf);
  renderer.setRenderTarget(prevTarget);
  // flip Y
  const img = thumbCtx.createImageData(160, 160);
  for (let y = 0; y < 160; y++) {
    const src = (159 - y) * 160 * 4, dst = y * 160 * 4;
    img.data.set(thumbBuf.subarray(src, src + 640), dst);
  }
  thumbCtx.putImageData(img, 0, 0);
  return thumbCanvas.toDataURL('image/png');
}

/* ---------- mobile bottom sheets ---------- */
function makeSheet(el, handle, initialH) {
  let dragging = false, startY = 0, startH = 0;
  const setH = (px) => { el.style.height = Math.min(window.innerHeight * 0.92, Math.max(px, 160)) + 'px'; };
  handle.addEventListener('pointerdown', (e) => {
    dragging = true; startY = e.clientY; startH = el.getBoundingClientRect().height;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    setH(startH - (e.clientY - startY));
  });
  handle.addEventListener('pointerup', (e) => {
    dragging = false;
    const h = el.getBoundingClientRect().height;
    if (h > window.innerHeight * 0.86) setH(window.innerHeight * 0.92);
  });
  handle.addEventListener('click', () => {
    const h = el.getBoundingClientRect().height;
    if (h > window.innerHeight * 0.86) setH(initialH);
  });
}

/* ---------- small-object LOD (distance ≥ 26 hides pots / shrubs / flowers / benches / string lights) ---------- */
const SMALL_LOD = { hidden: {}, recs: {} };
for (const kind in kitList) {
  kitList[kind].forEach((rec, i) => {
    if (!rec.small || !rec.island) return;
    (SMALL_LOD.recs[rec.island] ||= []).push({ kind, i, base: rec.m.clone() });
  });
}
const _lodM = new THREE.Matrix4();
function setSmallHidden(islId, hidden) {
  if (!!SMALL_LOD.hidden[islId] === hidden) return;
  SMALL_LOD.hidden[islId] = hidden;
  const touched = new Set();
  for (const r of SMALL_LOD.recs[islId] || []) {
    const mesh = kitMeshes[r.kind];
    if (!mesh) continue;
    if (hidden) { _lodM.makeScale(0, 0, 0); mesh.setMatrixAt(r.i, _lodM); }
    else mesh.setMatrixAt(r.i, r.base);
    touched.add(mesh);
  }
  for (const m of touched) m.instanceMatrix.needsUpdate = true;
}
let lodTick = 0;
function updateSmallLOD(dt) {
  lodTick += dt;
  if (lodTick < 0.25) return;
  lodTick = 0;
  for (const I of ISLANDS) {
    const isl = ISL_NODES[I.id];
    if (!isl) continue;   // 新聞島若未完成 buildIsland（__addIsland 早期失敗）都唔可以 crash
    const d = Math.hypot(camera.position.x - isl.x, camera.position.y - ISL_TOP, camera.position.z - isl.z);
    setSmallHidden(I.id, d >= 26);
  }
}

/* ---------- main loop ---------- */
const clock3 = new THREE.Clock();
let animT = 0;
let labelTick = 0;
let fpsAcc = 0, fpsFrames = 0, degraded = false;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock3.getDelta(), 0.08);
  if (!STATE.reduced) animT += dt;
  STATE.elapsed += dt;

  // 效能守護：連續低幀率 → 降級（關陰影 + 減像素比）
  if (!degraded && QUALITY === 'auto') {
    fpsAcc += dt; fpsFrames++;
    if (fpsFrames >= 90) {
      const fps = fpsFrames / fpsAcc;
      if (fps < 24) {
        degraded = true;
        renderer.shadowMap.enabled = false;
        renderer.setPixelRatio(Math.min(renderer.getPixelRatio(), 0.75));
        sun.castShadow = false;
        scene.traverse(o => { if (o.isMesh) o.material.needsUpdate = true; });
      }
      fpsAcc = 0; fpsFrames = 0;
    }
  }

  if (!TOGGLES.pause) {
    updateDayCycle(dt);
    seaUniforms.uTime.value = animT;
    flowMat.uniforms.uTime.value = animT;
    for (const f of FLOWS) FLOW_OBJ[f.id].tube.material.uniforms.uTime.value = animT;
    updateWalkers(dt, animT);
    // clouds
    for (const c of clouds) {
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 130) c.position.x = -130;
    }
    // sea props bobbing
    for (const p of seaProps) {
      if (p.kind === 'boat') {
        const u = p.obj.userData;
        const a = animT * u.speed + u.phase;
        p.obj.position.x = Math.cos(a) * u.radius;
        p.obj.position.z = Math.sin(a) * u.radius * 0.6 + 22;
        p.obj.position.y = -0.85 + Math.sin(animT * 1.3 + u.phase) * 0.09;
        p.obj.rotation.y = -a;
        p.obj.rotation.z = Math.sin(animT * 0.9 + u.phase) * 0.05;
      } else if (p.kind === 'islet') {
        p.obj.position.y = Math.sin(animT * 0.7 + p.obj.userData.bob) * 0.05;
      }
    }
    // labels + pins need render
    STATE.dirty = true;
  }
  updateFlight(dt);
  controls.update();
  updateSmallLOD(dt);   // 暫停時相機仍可移動 → LOD 必須獨立於動畫暫停

  labelTick += dt;
  if (labelTick > 0.12) { labelTick = 0; updateLabels(); }

  if (STATE.dirty) {
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
    STATE.dirty = false;
  }
}
tick();

/* ---------- debug hook ---------- */
window.__pid = () => ({
  ready: true,
  clock: Clock.label,
  night: +STATE.night.toFixed(3),
  islands: ISLANDS.length,
  items: Object.keys(ITEMS).length,
  flows: FLOWS.length,
  walkers: WALKERS.length,
  kitKinds: Object.keys(kitMeshes).length,
  instances: Object.values(kitMeshes).reduce((a, m) => a + m.count, 0),
  drawCalls: renderer.info.render.calls,
  triangles: renderer.info.render.triangles,
  sel: SEL,
  toggles: Object.assign({}, TOGGLES),

  walker0: WALKERS[0] ? { x: +WALKERS[0].x.toFixed(2), z: +WALKERS[0].z.toFixed(2), t: +WALKERS[0].t.toFixed(3) } : null,
  lod: { hidden: Object.assign({}, SMALL_LOD.hidden), tracked: Object.keys(SMALL_LOD.recs).length, count: Object.values(SMALL_LOD.recs).reduce((a, r) => a + r.length, 0) },
  dom: { themes: document.querySelectorAll('#tabThemes details.isl').length, flowRows: document.querySelectorAll('#tabFlows .flrow').length },
  pins: (typeof pinGroup !== 'undefined') ? pinGroup.children.length : -1,
  pinEls: document.querySelectorAll('.pinlab').length,
  css2dEls: document.getElementById('css2d').children.length,
  islandLabels: document.querySelectorAll('.ilabel').length,
  walkerNames: document.querySelectorAll('.wname').length,
  errors: window.__errs || [],
  degraded: degraded,
  quality: QUALITY,
  cdn: { base: CDN, viaFallback },
  fps: +(1 / Math.max(0.001, clock3.getDelta())).toFixed(1)
});
/* ---------- true pixel probe (headless screenshots don't composite WebGL) ---------- */
window.__sample = (grid) => {
  const gl = renderer.getContext();
  renderer.render(scene, camera);
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const px = new Uint8Array(4);
  const out = [];
  const n = grid || 5;
  for (let gy = 0; gy < n; gy++) {
    const row = [];
    for (let gx = 0; gx < n; gx++) {
      const x = Math.floor((gx + 0.5) / n * w);
      const y = Math.floor((gy + 0.5) / n * h);   // gl origin bottom-left
      gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      row.push([px[0], px[1], px[2]]);
    }
    out.push(row);
  }
  return JSON.stringify({ size: [w, h], grid: out });
};
window.__dumpPNG = () => {
  const gl = renderer.getContext();
  renderer.render(scene, camera);
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const buf = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  const img = cx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    const src = (h - 1 - y) * w * 4, dst = y * w * 4;
    img.data.set(buf.subarray(src, src + w * 4), dst);
  }
  cx.putImageData(img, 0, 0);
  return cv.toDataURL('image/png');
};
window.__probeWorld = (pts) => {
  const gl = renderer.getContext();
  renderer.render(scene, camera);
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const v = new THREE.Vector3();
  const px = new Uint8Array(4);
  const out = [];
  for (const P of pts) {
    v.set(P[0], P[1], P[2]).project(camera);
    const x = Math.round((v.x * 0.5 + 0.5) * w);
    const y = Math.round((v.y * 0.5 + 0.5) * h);
    if (x < 0 || y < 0 || x >= w || y >= h) { out.push({ P, off: true }); continue; }
    gl.readPixels(x, h - 1 - y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    out.push({ P, xy: [x, y], rgb: [px[0], px[1], px[2]] });
  }
  return JSON.stringify(out);
};
window.__internals = { terrainHeight, ISL_POS, ISL_NODES, ITEM_WORLD, ISLANDS, FLOWS, FLOW_OBJ, scene, camera, renderer, controls, Clock, STATE, TOGGLES, ARCH };
window.__pick = (px, py) => {
  const rc = new THREE.Raycaster();
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  rc.setFromCamera(new THREE.Vector2((px / w) * 2 - 1, -(py / h) * 2 + 1), camera);
  const hits = rc.intersectObjects(scene.children, true).slice(0, 6);
  return JSON.stringify(hits.map(h => ({
    d: +h.distance.toFixed(1),
    type: h.object.type,
    mat: h.object.material && h.object.material.type,
    col: h.object.material && h.object.material.color ? '#' + h.object.material.color.getHexString() : '',
    geo: h.object.geometry ? h.object.geometry.type : '',
    userData: h.object.userData,
    inst: h.instanceId
  })));
};
window.__errs = [];
window.addEventListener('error', (e) => { window.__errs.push(String(e.message)); });

/* ============ 09 · net: WebSocket + mutations + 加建築 UI ============
   Phase 2/3/4 前端：匿名 session、WS 即時同步、加建築、新聞島合併。
   靜態版（GitHub Pages）冇後端 → 所有功能自動 skip，唔影響 demo。 */
(function () {
  // 後端 API 地址：同源部署（Cloudflare Worker）→ location.origin；
  // 靜態託管（GitHub Pages）→ 用已部署嘅 Worker。
  const API = (location.hostname.includes('github.io') || location.protocol === 'file:')
    ? 'https://policy-islands.teddy-spot.workers.dev'
    : location.origin;

  const NET = {
    token: localStorage.getItem('pi_token') || null,
    ws: null, connected: false, seq: 0,
    lastError: null, attempts: 0
  };
  window.__net = NET;

  async function ensureSession() {
    if (NET.token) return NET.token;
    try {
      const r = await fetch(API + '/api/session', { method: 'POST' });
      const d = await r.json();
      if (d && d.token) {
        NET.token = d.token;
        localStorage.setItem('pi_token', d.token);
        return d.token;
      }
    } catch (e) { NET.lastError = 'session: ' + (e && e.message); }
    return null;
  }

  // 拉一次完整世界（初次載入時合併 server 新增嘅 items/islands）
  async function fetchWorld() {
    try {
      const r = await fetch(API + '/api/world');
      if (!r.ok) return;
      const w = await r.json();
      NET.seq = w.seq || 0;
      applyServerWorld(w);
    } catch (e) { NET.lastError = 'world: ' + (e && e.message); }
  }

  function applyServerWorld(w) {
    if (!w || !w.items) return;
    for (const it of w.items) {
      if (!ITEMS[it.id] && it.islandId && window.__addItemMesh) {
        ITEMS[it.id] = it;
        window.__addItemMesh(it);
      }
    }
    for (const isl of w.islands || []) {
      if (isl.origin === 'news' && !ISL_BY_ID[isl.id] && window.__addIsland) {
        // ⚠️ 唔好自己 push/設 ISL_BY_ID —— __addIsland 開頭 guard 會因此 return false
        // 導致 buildIsland 冇行、ISL_NODES 冇 entry（crash updateSmallLOD）。
        // __addIsland 自己會做：ISL_POS 計算 + ISL_BY_ID + ISLANDS.push + buildIsland。
        window.__addIsland(isl);
        // 新聞島地標細項
        if (window.__addItemMesh) {
          for (const it of w.items) {
            if (it.islandId === isl.id && !ITEMS[it.id]) {
              ITEMS[it.id] = it;
              window.__addItemMesh(it);
            }
          }
        }
      }
    }
  }

  // 即時同步：長輪詢 /api/mutations?since=N（WS 喺呢個 DO 環境 handshake 後 message
  // 唔通 —— 實測 broadcast to 0 sockets；polling 100% 可靠，budget 內）
  function startPolling() {
    const poll = async () => {
      try {
        const r = await fetch(API + '/api/mutations?since=' + NET.seq);
        if (r.ok) {
          const d = await r.json();
          NET.connected = true;
          if (d.seq > NET.seq) {
            NET.seq = d.seq;
            for (const m of d.mutations || []) handleMutation(m);
          }
        }
      } catch (e) { NET.lastError = 'poll: ' + (e && e.message); }
      setTimeout(poll, 12000);   // 12 秒一次：10 用戶 ≈ 72k req/日，免費層內
    };
    poll();
  }

  function handleMutation(mut) {
    NET.seq = Math.max(NET.seq, mut.seq || 0);
    try {
      if (typeof STATE !== 'undefined') STATE.dirty = true;
      if (typeof updateLabels === 'function') updateLabels();
    } catch (e) {}
    const p = mut.payload || {};
    if (mut.type === 'add_item' && p.item && !ITEMS[p.item.id]) {
      ITEMS[p.item.id] = p.item;
      if (window.__addItemMesh) window.__addItemMesh(p.item);
      toast('＋ ' + (p.item.name && p.item.name.zh) + ' 已加入世界');
    } else if (mut.type === 'add_island' && p.island) {
      if (window.__addIsland) window.__addIsland(p.island);   // 佢做晒 push+build+label
      toast('📰 新聞島「' + (p.island.name && p.island.name.zh) + '」出現');
    } else if (mut.type === 'add_flow' && p.flow) {
      if (!FLOWS.some(f => f.id === p.flow.id)) FLOWS.push(p.flow);
    }
  }

  // 提交 mutation（用戶加建築 / 加島）
  async function submitMutation(type, payload) {
    const token = await ensureSession();
    if (!token) throw new Error('無法建立 session');
    const r = await fetch(API + '/api/mutations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ type, payload })
    });
    const d = await r.json().catch(() => null);
    if (!r.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
    NET.seq = Math.max(NET.seq, d.seq || 0);
    // server 已廣播；本地即時反映（如果 WS 未連上）
    if (!NET.connected) {
      if (type === 'add_item' && payload.item && !ITEMS[payload.item.id]) {
        ITEMS[payload.item.id] = payload.item;
        if (window.__addItemMesh) window.__addItemMesh(payload.item);
      }
      if (type === 'add_island' && payload.island) {
        if (window.__addIsland) window.__addIsland(payload.island);
      }
    }
    return d;
  }

  /* ── 加建築 UI（FAB + modal）──────────────────────────────────────── */
  const MODEL_OPTIONS = [
    ['busstop', '🚏 巴士站'], ['tram', '🚋 叮叮'], ['starferry', '⛴️ 天星碼頭'],
    ['chaChaan', '☕ 茶餐廳'], ['temple', '🏯 文武廟'], ['market', '🥬 街市'],
    ['tonglau', '🏘️ 唐樓'], ['estate', '🏢 公屋'], ['skyscraper', '🏙️ 商廈'],
    ['pawnshop', '🀄 當鋪'], ['cinema', '🎬 戲院'], ['jockey', '🐎 馬會'],
    ['clinic', '🏥 診所'], ['classroom', '🏫 教室'], ['cottage', '🏠 小屋'],
    ['stall', '🧺 攤位'], ['lighthouse', '🗼 燈塔'], ['kcr', '🚂 火車站'],
    ['mahjong', '🀄 麻雀館'], ['pavilion', '⛱️ 涼亭'], ['bike', '🚲 單車架']
  ];
  let modalEl = null, fabEl = null;

  function injectAddUI() {
    if (document.getElementById('piFab')) return;
    const fab = document.createElement('button');
    fab.id = 'piFab';
    fab.textContent = '＋';
    fab.title = '加建築（市民提案）';
    fab.setAttribute('aria-label', '加建築');
    fab.style.cssText = 'position:fixed;right:18px;bottom:86px;z-index:60;width:52px;height:52px;border-radius:50%;border:none;background:#211d1d;color:#fff8f4;font-size:26px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);';
    fab.addEventListener('click', () => openModal());
    document.body.appendChild(fab);
    fabEl = fab;
    // 排行榜按鈕（遊戲改進 A）
    const lb = document.createElement('button');
    lb.id = 'piLb';
    lb.textContent = '🏆';
    lb.title = '貢獻榜';
    lb.setAttribute('aria-label', '貢獻榜');
    lb.style.cssText = 'position:fixed;right:18px;bottom:146px;z-index:60;width:52px;height:52px;border-radius:50%;border:none;background:#db6a41;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);';
    lb.addEventListener('click', () => openLeaderboard());
    document.body.appendChild(lb);
  }

  // 貢獻榜 modal（遊戲改進 A）
  function openLeaderboard() {
    if (document.getElementById('piLbModal')) { document.getElementById('piLbModal').style.display = 'block'; loadLeaderboard(); return; }
    const overlay = document.createElement('div');
    overlay.id = 'piLbModal';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:70;background:rgba(33,29,29,.45);display:flex;align-items:center;justify-content:center;';
    const card = document.createElement('div');
    card.style.cssText = 'width:min(380px,90vw);background:#fff8f4;border-radius:22px;padding:20px;box-shadow:0 18px 60px rgba(33,29,29,.4);';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;font-size:17px;">🏆 市民貢獻榜</h3>
        <button id="piLbClose" style="background:none;border:none;font-size:22px;cursor:pointer;">✕</button>
      </div>
      <div id="piLbList" style="display:flex;flex-direction:column;gap:6px;font-size:14px;">載入中…</div>`;
    overlay.appendChild(card);
    document.body.appendChild(overlay);
    card.querySelector('#piLbClose').addEventListener('click', () => { overlay.style.display = 'none'; });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.style.display = 'none'; });
    loadLeaderboard();
  }
  async function loadLeaderboard() {
    const listEl = document.getElementById('piLbList');
    if (!listEl) return;
    try {
      const r = await fetch(API + '/api/leaderboard');
      const d = await r.json();
      const rows = (d.leaderboard || []).map((u, i) =>
        '<div style="display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;background:' + (i % 2 ? '#f5ead9' : '#fff8f4') + ';">' +
        '<span>' + (i + 1) + '. ' + (u.handle || '匿名市民') + '</span>' +
        '<b style="color:#db6a41;">' + u.score + ' 分</b></div>').join('') ||
        '<div style="color:#6b5c50;">未有貢獻 — 快啲用 ＋ 加座建築！</div>';
      listEl.innerHTML = rows;
    } catch (e) {
      listEl.innerHTML = '<div style="color:#a83232;">排行榜暫時不可用：' + (e && e.message) + '</div>';
    }
  }

  function openModal() {
    if (modalEl) { modalEl.style.display = 'block'; return; }
    const overlay = document.createElement('div');
    overlay.id = 'piModal';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:70;background:rgba(33,29,29,.45);display:flex;align-items:center;justify-content:center;';
    const card = document.createElement('div');
    card.style.cssText = 'width:min(420px,90vw);max-height:86vh;overflow:auto;background:#fff8f4;border-radius:22px;padding:22px;box-shadow:0 18px 60px rgba(33,29,29,.4);';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;font-size:18px;">＋ 加建築（市民提案）</h3>
        <button id="piClose" style="background:none;border:none;font-size:22px;cursor:pointer;">✕</button>
      </div>
      <label style="font-size:12px;font-weight:700;color:#6b5c50;">揀島</label>
      <select id="piIsland" style="width:100%;padding:10px;border-radius:9px;border:1px solid #d8c8b4;margin:4px 0 12px;font-size:14px;"></select>
      <label style="font-size:12px;font-weight:700;color:#6b5c50;">揀建築</label>
      <select id="piModel" style="width:100%;padding:10px;border-radius:9px;border:1px solid #d8c8b4;margin:4px 0 12px;font-size:14px;"></select>
      <label style="font-size:12px;font-weight:700;color:#6b5c50;">名稱（1–24 字）</label>
      <input id="piName" maxlength="24" placeholder="例：街坊茶記" style="width:100%;padding:10px;border-radius:9px;border:1px solid #d8c8b4;margin:4px 0 16px;font-size:14px;box-sizing:border-box;" />
      <button id="piSubmit" style="width:100%;min-height:44px;border:none;border-radius:9px;background:#db6a41;color:#fff;font-size:15px;font-weight:800;cursor:pointer;">提交提案</button>
      <div id="piMsg" style="margin-top:10px;font-size:13px;min-height:18px;"></div>`;
    overlay.appendChild(card);
    document.body.appendChild(overlay);
    modalEl = overlay;

    // fill islands
    const isel = card.querySelector('#piIsland');
    for (const I of ISLANDS) {
      const o = document.createElement('option');
      o.value = I.id; o.textContent = I.no + ' ' + I.name.zh;
      isel.appendChild(o);
    }
    // fill models
    const msel = card.querySelector('#piModel');
    for (const [k, label] of MODEL_OPTIONS) {
      const o = document.createElement('option');
      o.value = k; o.textContent = label;
      msel.appendChild(o);
    }
    card.querySelector('#piClose').addEventListener('click', () => { overlay.style.display = 'none'; });
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.style.display = 'none'; });
    card.querySelector('#piSubmit').addEventListener('click', async () => {
      const msgEl = card.querySelector('#piMsg');
      const islandId = isel.value, model = msel.value, name = card.querySelector('#piName').value.trim();
      if (!name) { msgEl.textContent = '❌ 請填名稱'; msgEl.style.color = '#a83232'; return; }
      const id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const item = { id, islandId, no: 99, model, name: { zh: name, en: name } };
      msgEl.textContent = '⏳ 提交中…';
      try {
        const d = await submitMutation('add_item', { item });
        msgEl.textContent = '✅ 已提交（seq ' + d.seq + '）—— 世界已更新';
        msgEl.style.color = '#2f6f4f';
        card.querySelector('#piName').value = '';
      } catch (e) {
        msgEl.textContent = '❌ ' + (e && e.message);
        msgEl.style.color = '#a83232';
      }
    });
  }

  /* ── toast ─────────────────────────────────────────────────────────── */
  function toast(text) {
    let t = document.getElementById('piToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'piToast';
      t.style.cssText = 'position:fixed;top:16px;right:16px;z-index:80;background:#211d1d;color:#fff8f4;padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:300px;opacity:0;transition:opacity .3s;';
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.style.opacity = '1';
    clearTimeout(t._h);
    t._h = setTimeout(() => { t.style.opacity = '0'; }, 3200);
  }

  /* ── boot ──────────────────────────────────────────────────────────── */
  function boot() {
    // 靜態 host（GitHub Pages / file）→ 只做一次 world 合併，唔連 WS
    const staticHost = location.hostname.includes('github.io') || location.protocol === 'file:';
    if (staticHost) {
      fetchWorld();
      return;
    }
    fetchWorld();
    startPolling();
    injectAddUI();
    window.__submitMutation = submitMutation;
    window.__piRefreshSidebar = () => {};
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
